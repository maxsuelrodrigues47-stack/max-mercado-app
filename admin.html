<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Max Mercado</title><style>
:root{--green:#137a45;--dark:#07552e;--bg:#f4f7f4;--ink:#173126;--muted:#66766b;--line:#dfe8e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,sans-serif;color:var(--ink)}header{background:var(--dark);color:white;padding:20px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.hidden{display:none!important}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d0ddd2;border-radius:9px;font:inherit}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--green);color:white;font-weight:800;cursor:pointer}.btn.secondary{background:#e7f2e8;color:var(--dark)}.btn.danger{background:#a72c2c}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button.active{background:var(--dark);color:white}.status{color:var(--muted);font-size:13px}.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.itemhead{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}.item h3{margin:0 0 5px;font-size:16px}.item p{margin:4px 0;color:var(--muted);font-size:13px}.itemactions{display:flex;gap:6px;flex-wrap:wrap}.itemactions .btn{padding:7px 10px;font-size:12px}.error{color:#a72c2c}.success{color:#176b3a}.tablelike{display:grid;gap:0}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8f5e8;color:#176b3a;font-size:12px;font-weight:750}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .wide{grid-column:1/-1}@media(max-width:600px){.row,.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}main{margin-top:14px}.card{padding:15px}}
</style></head><body><header><h1>🛒 Painel do mercado</h1><button class="btn secondary hidden" id="logout">Sair</button></header><main>
<section class="card" id="loginCard"><h2>Entrar no painel</h2><p class="status">Use o acesso administrativo fornecido para este mercado.</p><div class="field"><label>Mercado (slug)</label><input id="storeSlug" placeholder="max-mercado"></div><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="login">Entrar</button><p id="loginMessage" role="alert"></p></section>
<section id="dashboard" class="hidden"><div class="card"><h2 id="welcome">Painel</h2><p class="status">As alterações são salvas no banco e aparecem na loja pública.</p><div class="tabs"><button class="btn secondary active" data-tab="productsTab">Produtos</button><button class="btn secondary" data-tab="ordersTab">Pedidos</button><button class="btn secondary" data-tab="storeTab">Configurações</button></div></div>
<section class="card" id="productsTab"><div class="itemhead"><h2>Produtos</h2><button class="btn" id="newProduct">+ Adicionar produto</button></div><div id="productForm" class="hidden"><h3 id="productFormTitle">Novo produto</h3><input id="productId" type="hidden"><div class="formgrid"><div class="field"><label>Nome</label><input id="pName" maxlength="160"></div><div class="field"><label>Categoria</label><input id="pCategory" maxlength="80" placeholder="Mercearia"></div><div class="field"><label>Preço (R$)</label><input id="pPrice" type="number" min="0" step="0.01"></div><div class="field"><label>Estoque</label><input id="pStock" type="number" min="0" step="1"></div><div class="field wide"><label>Descrição</label><textarea id="pDescription" rows="2" maxlength="500"></textarea></div><div class="field wide"><label>URL da imagem (opcional)</label><input id="pImage" type="url" maxlength="1000" placeholder="https://..."></div><div class="field"><label><input id="pActive" type="checkbox" checked style="width:auto"> Produto visível na loja</label></div></div><button class="btn" id="saveProduct">Salvar produto</button> <button class="btn secondary" id="cancelProduct">Cancelar</button><p id="productMessage"></p></div><div id="productsList"></div></section>
<section class="card hidden" id="ordersTab"><div class="itemhead"><h2>Pedidos recentes</h2><button class="btn secondary" id="refreshOrders">Atualizar</button></div><div id="ordersList"></div></section>
<section class="card hidden" id="storeTab"><h2>Dados da loja</h2><div class="field"><label>Nome do mercado</label><input id="storeName"></div><div class="field"><label>WhatsApp com código do país e DDD (ex.: 5516999999999)</label><input id="storeWhatsApp"></div><button class="btn" id="saveStore">Salvar configurações</button><p id="storeMessage"></p></section></section></main>
<script>
const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);$("storeSlug").value=qs.get("store")||"max-mercado";let token=localStorage.getItem("mm_admin_token")||"",storeInfo=null;const fmt=n=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(n)||0);function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};const r=await fetch(url,opts);const d=await r.json().catch(()=>({error:"Resposta inválida"}));if(!r.ok)throw new Error(d.error||"Erro");return d}
function showLogin(){ $("loginCard").classList.remove("hidden");$("dashboard").classList.add("hidden");$("logout").classList.add("hidden")}
function showDashboard(){ $("loginCard").classList.add("hidden");$("dashboard").classList.remove("hidden");$("logout").classList.remove("hidden")}
$("login").onclick=async()=>{try{$("loginMessage").textContent="Entrando…";const d=await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({store:$("storeSlug").value.trim(),email:$("email").value.trim(),password:$("password").value})});token=d.token;localStorage.setItem("mm_admin_token",token);await initDashboard()}catch(e){$("loginMessage").className="error";$("loginMessage").textContent=e.message}};
$("logout").onclick=()=>{token="";localStorage.removeItem("mm_admin_token");showLogin()};
async function initDashboard(){try{const d=await api("/api/admin/me");storeInfo=d.store;$("welcome").textContent="Painel — "+storeInfo.name;$("storeName").value=storeInfo.name;$("storeWhatsApp").value=storeInfo.whatsapp;showDashboard();await loadProducts();await loadOrders()}catch(e){token="";localStorage.removeItem("mm_admin_token");showLogin();$("loginMessage").textContent=e.message}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["productsTab","ordersTab","storeTab"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab))});
function resetProductForm(){$("productForm").classList.add("hidden");$("productId").value="";["pName","pCategory","pPrice","pStock","pDescription","pImage"].forEach(id=>$(id).value="");$("pActive").checked=true;$("productMessage").textContent=""}
$("newProduct").onclick=()=>{resetProductForm();$("productFormTitle").textContent="Novo produto";$("productForm").classList.remove("hidden")};$("cancelProduct").onclick=resetProductForm;
function productPayload(){return {name:$("pName").value.trim(),category:$("pCategory").value.trim()||"Outros",price:Number($("pPrice").value),stock:Number($("pStock").value),description:$("pDescription").value.trim(),imageUrl:$("pImage").value.trim(),active:$("pActive").checked}}
$("saveProduct").onclick=async()=>{try{const payload=productPayload();if(!payload.name||$("pPrice").value===""||$("pStock").value==="")throw new Error("Preencha nome, preço e estoque.");const id=$("productId").value;await api(id?"/api/admin/products/"+id:"/api/admin/products",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});$("productMessage").className="success";$("productMessage").textContent="Produto salvo!";resetProductForm();await loadProducts()}catch(e){$("productMessage").className="error";$("productMessage").textContent=e.message}};
async function loadProducts(){try{const d=await api("/api/admin/products");$("productsList").innerHTML=d.products.length?d.products.map(p=>`<div class="item"><div class="itemhead"><div><h3>${esc(p.name)} ${p.active?'<span class="badge">Visível</span>':'<span class="badge">Oculto</span>'}</h3><p>${esc(p.category)} · ${fmt(p.price)} · Estoque: ${p.stock}</p></div><div class="itemactions"><button class="btn secondary" onclick="editProduct(${p.id})">Editar</button><button class="btn secondary" onclick="toggleProduct(${p.id},${!p.active})">${p.active?"Ocultar":"Mostrar"}</button><button class="btn danger" onclick="deleteProduct(${p.id})">Excluir</button></div></div></div>`).join(""):'<p>Nenhum produto cadastrado.</p>'}catch(e){$("productsList").textContent=e.message}}
window.editProduct=async id=>{const d=await api("/api/admin/products");const p=d.products.find(x=>Number(x.id)===Number(id));if(!p)return;$("productId").value=p.id;$("pName").value=p.name;$("pCategory").value=p.category;$("pPrice").value=p.price;$("pStock").value=p.stock;$("pDescription").value=p.description;$("pImage").value=p.image_url;$("pActive").checked=p.active;$("productFormTitle").textContent="Editar produto";$("productForm").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})};
window.toggleProduct=async(id,active)=>{try{const d=await api("/api/admin/products");const p=d.products.find(x=>Number(x.id)===Number(id));await api("/api/admin/products/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:p.name,category:p.category,price:Number(p.price),stock:p.stock,description:p.description,imageUrl:p.image_url,active})});await loadProducts()}catch(e){alert(e.message)}};
window.deleteProduct=async id=>{if(!confirm("Excluir este produto?"))return;try{await api("/api/admin/products/"+id,{method:"DELETE"});await loadProducts()}catch(e){alert(e.message)}};
async function loadOrders(){try{const d=await api("/api/admin/orders");$("ordersList").innerHTML=d.orders.length?d.orders.map(o=>`<div class="item"><div class="itemhead"><div><h3>Pedido #${o.id} · ${fmt(o.total)}</h3><p>${esc(o.customer_name)} · ${esc(o.phone)} · ${esc(o.created_at?new Date(o.created_at).toLocaleString("pt-BR"):"")}</p><p>${esc(o.address)} · Pagamento: ${esc(o.payment_method)}</p><p>${(o.items||[]).map(i=>`${i.quantity}x ${esc(i.name)} (${fmt(i.price*i.quantity)})`).join(" · ")}</p>${o.notes?`<p>Obs.: ${esc(o.notes)}</p>`:""}</div><div><span class="badge">${esc(o.status)}</span><div class="field"><select id="status-${o.id}">${["Novo","Confirmado","Em preparo","Saiu para entrega","Concluído","Cancelado"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div><button class="btn secondary" onclick="updateOrder(${o.id})">Atualizar status</button></div></div></div>`).join(""):'<p>Nenhum pedido recebido ainda.</p>'}catch(e){$("ordersList").textContent=e.message}}
window.updateOrder=async id=>{try{await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:$("status-"+id).value})});await loadOrders()}catch(e){alert(e.message)}};$("refreshOrders").onclick=loadOrders;
$("saveStore").onclick=async()=>{try{const d=await api("/api/admin/store",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("storeName").value,whatsapp:$("storeWhatsApp").value})});storeInfo=d.store;$("storeMessage").className="success";$("storeMessage").textContent="Configurações salvas.";$("welcome").textContent="Painel — "+storeInfo.name}catch(e){$("storeMessage").className="error";$("storeMessage").textContent=e.message}};
if(token)initDashboard();else showLogin();
</script></body></html>
